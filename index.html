<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEBULA · ultra-glass music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    /* ============================================================
       ULTRA-PREMIUM GLASSMORPHISM — RED / YELLOW / BLACK
       ============================================================ */
    :root {
      --bg-deep: #050505;
      --bg-mid: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-hover: rgba(255, 255, 255, 0.12);
      --glass-strong: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-light: rgba(255, 255, 255, 0.28);
      --glass-highlight: rgba(255, 255, 255, 0.06);

      --text-primary: #f8f8f8;
      --text-secondary: rgba(248, 248, 248, 0.72);
      --text-muted: rgba(248, 248, 248, 0.45);

      --red: #ff2b2b;
      --red-soft: rgba(255, 43, 43, 0.65);
      --red-glow: rgba(255, 43, 43, 0.35);
      --yellow: #ffd700;
      --yellow-soft: rgba(255, 215, 0, 0.65);
      --yellow-glow: rgba(255, 215, 0, 0.35);

      --gradient-red-yellow: linear-gradient(135deg, #ff2b2b 0%, #ffd700 100%);
      --gradient-yellow-red: linear-gradient(135deg, #ffd700 0%, #ff2b2b 100%);

      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
      --shadow-glass-deep: 0 16px 48px rgba(0, 0, 0, 0.45);
      --shadow-glow-red: 0 0 40px rgba(255, 43, 43, 0.25);
      --shadow-glow-yellow: 0 0 40px rgba(255, 215, 0, 0.22);

      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 32px;
      --radius-xl: 44px;

      --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --player-height: 96px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: calc(var(--player-height) + 28px);
      min-height: 100vh;
    }

    /* Ambient background with colorful light orbs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 60% 50% at 15% 20%, rgba(255, 43, 43, 0.16) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 75%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 45% 45% at 50% 50%, rgba(255, 100, 50, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 70% 70% at 70% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 60%),
        #050505;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    ::selection { background: var(--red); color: #fff; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); background-clip: padding-box; }

    /* ============================================================
       BANNER HEADER — IMAGE ONLY (no radius)
       ============================================================ */
    .banner-header {
      position: relative;
      z-index: 100;
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 28px 0;
    }

    .banner-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .banner-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    /* ============================================================
       HERO
       ============================================================ */
    .hero {
      position: relative;
      max-width: 1440px;
      margin: 0 auto;
      padding: 60px 28px 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 44px;
      overflow: hidden;
      min-height: 400px;
    }
    .hero-content { position: relative; z-index: 2; flex: 1; max-width: 560px; }
    .hero-title {
      font-size: clamp(2.6rem, 5.5vw, 4.6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, var(--yellow) 55%, var(--red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: heroFadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .hero-subtitle {
      font-size: clamp(0.95rem, 1.5vw, 1.15rem);
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 0.01em;
      animation: heroFadeIn 1s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 34px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.75) 0%, rgba(255, 215, 0, 0.75) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #050505;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 0 36px var(--red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: heroFadeIn 1s 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.7s ease;
    }
    .btn-primary:hover::after { transform: translateX(120%); }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 56px var(--red-glow), 0 0 80px var(--yellow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .btn-primary i { transition: transform var(--transition); }
    .btn-primary:hover i { transform: translateX(4px); }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 46px;
      margin-top: 36px;
      animation: heroFadeIn 1s 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .equalizer span {
      width: 7px;
      border-radius: 99px;
      background: linear-gradient(to top, var(--red), var(--yellow));
      box-shadow: 0 0 14px var(--red-glow);
      animation: eqBounce 1.2s ease-in-out infinite alternate;
    }
    .equalizer span:nth-child(1) { height: 14px; animation-delay: 0s; }
    .equalizer span:nth-child(2) { height: 34px; animation-delay: 0.15s; }
    .equalizer span:nth-child(3) { height: 22px; animation-delay: 0.3s; }
    .equalizer span:nth-child(4) { height: 42px; animation-delay: 0.45s; }
    .equalizer span:nth-child(5) { height: 26px; animation-delay: 0.6s; }
    .equalizer span:nth-child(6) { height: 38px; animation-delay: 0.75s; }
    @keyframes eqBounce {
      0%   { transform: scaleY(0.35); opacity: 0.45; }
      100% { transform: scaleY(1);    opacity: 1; }
    }

    .hero-art {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      animation: heroFadeIn 1.1s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .hero-art-inner {
      width: clamp(190px, 20vw, 280px);
      aspect-ratio: 1;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px) saturate(1.6);
      -webkit-backdrop-filter: blur(25px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 60px rgba(255, 43, 43, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
      font-size: clamp(3.5rem, 7vw, 6.5rem);
      color: rgba(255, 255, 255, 0.85);
      animation: artFloat 6s ease-in-out infinite alternate;
      position: relative;
      overflow: hidden;
    }
    .hero-art-inner::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 43, 43, 0.18), rgba(255, 215, 0, 0.12), transparent 30%);
      animation: rotateSlow 10s linear infinite;
      border-radius: 50%;
    }
    .hero-art-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%, transparent 60%, rgba(255,215,0,0.06) 100%);
      pointer-events: none;
    }
    .hero-art-inner i { position: relative; z-index: 1; filter: drop-shadow(0 0 30px var(--red-glow)); }
    @keyframes artFloat {
      from { transform: translateY(0) rotate(-2deg); }
      to   { transform: translateY(-16px) rotate(2deg); }
    }
    @keyframes rotateSlow { to { transform: rotate(360deg); } }

    /* ============================================================
       MUSIC SECTION
       ============================================================ */
    .music-section {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 28px 20px;
      position: relative;
      z-index: 2;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 30px;
    }
    .section-header h2 {
      font-size: clamp(1.5rem, 2.4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-primary);
    }
    .section-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-secondary:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 215, 0, 0.35);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.08);
      transform: translateY(-2px);
    }
    .btn-secondary.active {
      color: #050505;
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.8) 0%, rgba(255, 215, 0, 0.8) 100%);
      border-color: transparent;
      box-shadow: 0 0 24px var(--red-glow);
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .music-card {
      position: relative;
      background: rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(25px) saturate(1.5);
      -webkit-backdrop-filter: blur(25px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 18px;
      transition: all var(--transition);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
      animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .music-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      opacity: 0.6;
    }
    .music-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 215, 0, 0.28);
      transform: translateY(-8px);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.45),
        0 0 40px rgba(255, 43, 43, 0.10),
        0 0 60px rgba(255, 215, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .card-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      transition: transform var(--transition);
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.55) 0%, rgba(255, 215, 0, 0.55) 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.25), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .card-art i {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.5));
    }
    .card-art::after {
      content: '';
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.22), transparent 25%);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .music-card:hover .card-art::after {
      opacity: 1;
      animation: rotateSlow 6s linear infinite;
    }
    .music-card.playing .card-art { animation: spinArt 10s linear infinite; }
    .music-card.playing .card-art::after {
      opacity: 1;
      animation: rotateSlow 6s linear infinite;
    }
    @keyframes spinArt { to { transform: rotate(360deg); } }

    .card-info { display: flex; flex-direction: column; gap: 3px; }
    .card-title {
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .card-artist {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.73rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .card-actions { display: flex; align-items: center; gap: 9px; margin-top: 2px; }
    .card-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .card-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      transform: scale(1.1);
    }
    .card-btn.play-btn-card {
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.85) 0%, rgba(255, 215, 0, 0.85) 100%);
      color: #050505;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 22px var(--red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .card-btn.play-btn-card:hover {
      transform: scale(1.14);
      box-shadow: 0 0 36px var(--red-glow), 0 0 50px var(--yellow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .card-btn.liked {
      color: var(--red);
      border-color: rgba(255, 43, 43, 0.45);
      box-shadow: 0 0 18px rgba(255, 43, 43, 0.25);
      background: rgba(255, 43, 43, 0.10);
    }
    .card-btn.downloaded {
      color: var(--yellow);
      border-color: rgba(255, 215, 0, 0.45);
      background: rgba(255, 215, 0, 0.08);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
    }
    .empty-state i {
      display: block;
      font-size: 2.8rem;
      margin-bottom: 18px;
      background: var(--gradient-red-yellow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ============================================================
       DOWNLOADS
       ============================================================ */
    .downloads-section {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative;
      z-index: 2;
    }
    .downloads-section h2 {
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .downloads-section h2 i {
      background: var(--gradient-red-yellow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .downloads-list { display: flex; flex-direction: column; gap: 12px; }
    .download-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: all var(--transition);
      animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .download-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 215, 0, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 24px rgba(255, 215, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }
    .download-item .dl-art {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.65) 0%, rgba(255, 215, 0, 0.65) 100%);
      display: grid;
      place-items: center;
      color: #050505;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .download-item .dl-info { flex: 1; min-width: 0; }
    .download-item .dl-title {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .download-item .dl-artist { font-size: 0.76rem; color: var(--text-secondary); }
    .download-item .dl-status {
      font-size: 0.73rem;
      color: var(--yellow);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .downloads-list .empty-state { margin: 0; }

    /* ============================================================
       FLOATING GLASS PLAYER
       ============================================================ */
    .player {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      width: min(1180px, calc(100% - 36px));
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px) saturate(1.8);
      -webkit-backdrop-filter: blur(30px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-xl);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 24px 64px rgba(0, 0, 0, 0.3),
        0 0 60px rgba(255, 43, 43, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: background var(--transition), border-color var(--transition);
      overflow: hidden;
    }
    .player::before {
      content: '';
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      pointer-events: none;
    }

    .player-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 28px;
      height: var(--player-height);
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .player-song {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      flex: 0 0 230px;
    }
    .player-art {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.7) 0%, rgba(255, 215, 0, 0.7) 100%);
      display: grid;
      place-items: center;
      color: #050505;
      font-size: 1.35rem;
      flex-shrink: 0;
      box-shadow: 0 0 24px var(--red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: transform var(--transition);
    }
    .player-art.spinning { animation: spinArt 8s linear infinite; }
    .player-meta { display: flex; flex-direction: column; min-width: 0; }
    .player-title {
      font-weight: 700;
      font-size: 0.94rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-artist {
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ctrl-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      transition: all var(--transition);
    }
    .ctrl-btn:hover {
      color: var(--yellow);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
      transform: scale(1.08);
    }
    .ctrl-btn.small { width: 36px; height: 36px; font-size: 0.8rem; }
    .ctrl-btn.small.active {
      color: var(--yellow);
      text-shadow: 0 0 14px var(--yellow-glow);
    }
    .play-btn {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.85) 0%, rgba(255, 215, 0, 0.85) 100%);
      color: #050505;
      font-size: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 28px var(--red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 44px var(--red-glow), 0 0 60px var(--yellow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      background: linear-gradient(135deg, rgba(255, 43, 43, 0.9) 0%, rgba(255, 215, 0, 0.9) 100%);
      color: #050505;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .player-progress { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 120px; }
    .player-progress span {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      width: 38px;
      text-align: center;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
      flex: 1;
      transition: background var(--transition);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--yellow));
      box-shadow: 0 0 14px var(--red-glow), 0 2px 6px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: transform var(--transition);
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--yellow));
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      box-shadow: 0 0 14px var(--red-glow);
    }

    .player-volume { display: flex; align-items: center; gap: 10px; flex: 0 0 170px; }
    .player-volume i {
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color var(--transition);
      flex-shrink: 0;
    }
    .player-volume i:hover { color: var(--yellow); }
    .player-volume input[type="range"] { max-width: 74px; }

    .player-visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 26px;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .player-visualizer span {
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(to top, var(--red), var(--yellow));
      box-shadow: 0 0 10px var(--red-glow);
      animation: eqBounce 1s ease-in-out infinite alternate;
    }
    .player-visualizer span:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .player-visualizer span:nth-child(2) { height: 20px; animation-delay: 0.15s; }
    .player-visualizer span:nth-child(3) { height: 13px; animation-delay: 0.3s; }
    .player-visualizer span:nth-child(4) { height: 24px; animation-delay: 0.45s; }
    .player-visualizer span:nth-child(5) { height: 11px; animation-delay: 0.6s; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: calc(var(--player-height) + 44px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 15px 30px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid rgba(255, 215, 0, 0.25);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 32px rgba(255, 215, 0, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { color: var(--yellow); }

    /* ============================================================
       FLOATING LIGHT ORBS
       ============================================================ */
    .light-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .light-orbs .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .light-orbs .orb:nth-child(1) {
      width: 420px;
      height: 420px;
      background: rgba(255, 43, 43, 0.18);
      top: -10%;
      left: -5%;
      animation-delay: 0s;
    }
    .light-orbs .orb:nth-child(2) {
      width: 380px;
      height: 380px;
      background: rgba(255, 215, 0, 0.14);
      bottom: 0%;
      right: -5%;
      animation-delay: -7s;
    }
    .light-orbs .orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: rgba(255, 100, 50, 0.10);
      top: 40%;
      left: 45%;
      animation-delay: -14s;
    }
    .light-orbs .orb:nth-child(4) {
      width: 250px;
      height: 250px;
      background: rgba(255, 200, 0, 0.08);
      top: 70%;
      left: 20%;
      animation-delay: -4s;
    }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -50px) scale(1.15); }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1024px) {
      .hero { padding: 50px 28px 40px; }
      .player-song { flex: 0 0 170px; }
      .player-volume { flex: 0 0 120px; }
      .player-inner { padding: 14px 20px; gap: 16px; }
      .banner-header { padding: 14px 20px 0; }
    }

    @media (max-width: 860px) {
      .hero { flex-direction: column; text-align: center; padding-top: 48px; }
      .hero-content { max-width: 100%; }
      .equalizer { justify-content: center; }
      .hero-art-inner { width: 170px; }
      .player {
        bottom: 12px;
        width: calc(100% - 24px);
      }
      .player-inner { padding: 12px 16px; gap: 12px; height: 84px; }
      .player-song { flex: 0 0 150px; }
      .player-volume { display: none; }
      .player-progress { min-width: 80px; }
    }

    @media (max-width: 640px) {
      .banner-header { padding: 12px 16px 0; }
      .hero { padding: 40px 20px 32px; min-height: 340px; }
      .hero-art-inner { width: 140px; }
      .music-section { padding: 30px 18px 16px; }
      .music-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .music-card { padding: 14px; border-radius: 18px; }
      .card-art { font-size: 2rem; border-radius: 12px; }
      .card-title { font-size: 0.88rem; }
      .card-btn { width: 32px; height: 32px; font-size: 0.75rem; }
      .player {
        bottom: 10px;
        width: calc(100% - 20px);
        border-radius: var(--radius-lg);
      }
      .player-inner { padding: 10px 14px; height: 80px; gap: 10px; }
      .player-art { width: 44px; height: 44px; font-size: 1.1rem; border-radius: 13px; }
      .player-title { font-size: 0.8rem; }
      .player-artist { font-size: 0.68rem; }
      .player-song { flex: 0 0 110px; }
      .ctrl-btn { width: 34px; height: 34px; font-size: 0.82rem; }
      .play-btn { width: 44px; height: 44px; font-size: 1rem; }
      .player-progress span { font-size: 0.62rem; width: 30px; }
      .toast { font-size: 0.78rem; padding: 12px 22px; white-space: normal; text-align: center; max-width: 90vw; }
      .section-header h2 { font-size: 1.2rem; }
      .downloads-section { padding: 30px 18px 100px; }
    }

    @media (max-width: 420px) {
      .music-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .player-song { flex: 0 0 90px; }
      .player-art { width: 38px; height: 38px; }
      .player-title { font-size: 0.72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Floating ambient light orbs -->
  <div class="light-orbs" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <!-- ==================== BANNER HEADER — IMAGE ONLY ==================== -->
  <header class="banner-header">
    <div class="banner-image-wrap">
      <img
        src="வீரத்தின் வித்துக்கள்_ ஒலிப் பேழை 2026.png"
        alt="வீரத்தின் வித்துக்கள் — ஒலிப் பேழை 2026"
        class="banner-image"
        loading="eager"
      />
    </div>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main class="main">
    <!-- HERO -->
    <section class="hero" id="heroSection">
      <div class="hero-content">
        <h1 class="hero-title">Feel Every Beat.</h1>
        <p class="hero-subtitle">Your music. Your mood. Your moment.</p>
        <button class="btn-primary" id="exploreBtn">Explore Music <i class="fas fa-arrow-right"></i></button>
        <div class="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="hero-art">
        <div class="hero-art-inner">
          <i class="fas fa-compact-disc"></i>
        </div>
      </div>
    </section>

    <!-- MUSIC COLLECTION -->
    <section class="music-section" id="musicSection">
      <div class="section-header">
        <h2>Midnight Collection</h2>
        <div class="section-actions">
          <button id="sortBtn" class="btn-secondary"><i class="fas fa-sort"></i> Sort by Title</button>
          <button id="filterFavBtn" class="btn-secondary"><i class="fas fa-heart"></i> Favorites</button>
        </div>
      </div>
      <div class="music-grid" id="musicGrid"></div>
    </section>

    <!-- DOWNLOADS -->
    <section class="downloads-section" id="downloadsSection">
      <h2><i class="fas fa-download"></i> Your Downloads</h2>
      <div id="downloadsList" class="downloads-list">
        <p class="empty-state"><i class="fas fa-cloud-download-alt"></i> No downloads yet. Click the download icon on any song.</p>
      </div>
    </section>
  </main>

  <!-- ==================== FLOATING GLASS PLAYER ==================== -->
  <footer class="player" id="player">
    <div class="player-inner">
      <div class="player-song">
        <div class="player-art" id="playerArt"><i class="fas fa-music"></i></div>
        <div class="player-meta">
          <span class="player-title" id="playerTitle">—</span>
          <span class="player-artist" id="playerArtist">—</span>
        </div>
      </div>

      <div class="player-controls">
        <button id="prevBtn" class="ctrl-btn" aria-label="Previous"><i class="fas fa-step-backward"></i></button>
        <button id="playPauseBtn" class="ctrl-btn play-btn" aria-label="Play/Pause"><i class="fas fa-play"></i></button>
        <button id="nextBtn" class="ctrl-btn" aria-label="Next"><i class="fas fa-step-forward"></i></button>
        <button id="shuffleBtn" class="ctrl-btn small" aria-label="Shuffle"><i class="fas fa-random"></i></button>
        <button id="repeatBtn" class="ctrl-btn small" aria-label="Repeat"><i class="fas fa-redo"></i></button>
      </div>

      <div class="player-progress">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" />
        <span id="totalDuration">0:00</span>
      </div>

      <div class="player-volume">
        <i class="fas fa-volume-up" id="volumeIcon"></i>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.7" />
        <div class="player-visualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="audioPlayer"></audio>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    /* ============================================================
       SONG DATA — LOCAL WAV FILES
       ============================================================ */
    const SONGS = [
      { id: 1, title: 'Midnight Dreams', artist: 'Aurora Lane', duration: '3:42', artIcon: 'fa-moon',
        audioUrl: 'Poovoodu Kathei 2TRK_Master_wav.wav', filename: 'midnight-dreams.wav' },
      { id: 2, title: 'Neon Lights', artist: 'Neon Pulse', duration: '2:58', artIcon: 'fa-bolt',
        audioUrl: 'VIDUDHALAI SOORIYAN MIX 2.wav', filename: 'neon-lights.wav' },
      { id: 3, title: 'Lost in Paradise', artist: 'Velvet Sky', duration: '4:15', artIcon: 'fa-umbrella-beach',
        audioUrl: 'களுத்தில் நஞ்சை.wav', filename: 'lost-in-paradise.wav' },
      { id: 4, title: 'Ocean Waves', artist: 'Blue Horizon', duration: '3:21', artIcon: 'fa-water',
        audioUrl: 'சுடரேற்றுவோம் நினைவுச் சுடர் ஏற்றுவோம்.wav', filename: 'ocean-waves.wav' },
      { id: 5, title: 'Electric Heart', artist: 'Volt Age', duration: '3:05', artIcon: 'fa-heart',
        audioUrl: 'தேசத்தை நேசித்த.wav', filename: 'electric-heart.wav' },
      { id: 6, title: 'Moonlight Vibes', artist: 'Lunar Echo', duration: '3:50', artIcon: 'fa-star',
        audioUrl: 'புலர்கின்ற பொழுதெல்லாம் தலைவா.wav', filename: 'moonlight-vibes.wav' },
      { id: 7, title: 'Endless Journey', artist: 'Path Finder', duration: '4:33', artIcon: 'fa-road',
        audioUrl: 'வீரமா கடலே.wav', filename: 'endless-journey.wav' },
      { id: 8, title: 'Golden Memories', artist: 'Summer Gold', duration: '3:12', artIcon: 'fa-sun',
        audioUrl: 'வீரவணக்கம் வீரவணக்கம்.wav', filename: 'golden-memories.wav' }
    ];

    /* ============================================================
       STATE
       ============================================================ */
    const state = {
      currentSongIndex: 0,
      isPlaying: false,
      likedSongs: new Set(),
      downloadedSongs: new Set(),
      shuffle: false,
      repeat: false,
      sortAsc: true,
      filterFavorites: false,
      searchQuery: '',
      downloads: []
    };

    /* ============================================================
       DOM REFS
       ============================================================ */
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const audio = $('#audioPlayer');
    const musicGrid = $('#musicGrid');
    const playPauseBtn = $('#playPauseBtn');
    const prevBtn = $('#prevBtn');
    const nextBtn = $('#nextBtn');
    const shuffleBtn = $('#shuffleBtn');
    const repeatBtn = $('#repeatBtn');
    const progressBar = $('#progressBar');
    const volumeBar = $('#volumeBar');
    const volumeIcon = $('#volumeIcon');
    const currentTimeEl = $('#currentTime');
    const totalDurationEl = $('#totalDuration');
    const playerTitle = $('#playerTitle');
    const playerArtist = $('#playerArtist');
    const playerArt = $('#playerArt');
    const toast = $('#toast');
    const sortBtn = $('#sortBtn');
    const filterFavBtn = $('#filterFavBtn');
    const downloadsList = $('#downloadsList');
    const exploreBtn = $('#exploreBtn');

    /* ============================================================
       UTILITIES
       ============================================================ */
    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function showToast(message, icon = 'fa-check-circle') {
      toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    /* ============================================================
       RENDER MUSIC GRID
       ============================================================ */
    function getFilteredSongs() {
      let list = [...SONGS];
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        list = list.filter(s =>
          s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
        );
      }
      if (state.filterFavorites) {
        list = list.filter(s => state.likedSongs.has(s.id));
      }
      list.sort((a, b) => {
        const cmp = a.title.localeCompare(b.title);
        return state.sortAsc ? cmp : -cmp;
      });
      return list;
    }

    function renderMusicGrid() {
      const songs = getFilteredSongs();
      musicGrid.innerHTML = '';

      if (songs.length === 0) {
        musicGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            No songs found. Try a different search or filter.
          </div>`;
        return;
      }

      songs.forEach((song, i) => {
        const isPlaying = state.isPlaying && state.currentSongIndex === SONGS.indexOf(song);
        const isLiked = state.likedSongs.has(song.id);
        const isDownloaded = state.downloadedSongs.has(song.id);

        const card = document.createElement('article');
        card.className = `music-card${isPlaying ? ' playing' : ''}`;
        card.style.animationDelay = `${i * 0.04}s`;
        card.dataset.songId = song.id;

        card.innerHTML = `
          <div class="card-art"><i class="fas ${song.artIcon}"></i></div>
          <div class="card-info">
            <div class="card-title" title="${song.title}">${song.title}</div>
            <div class="card-artist" title="${song.artist}">${song.artist}</div>
            <div class="card-meta"><i class="far fa-clock"></i> ${song.duration}</div>
          </div>
          <div class="card-actions">
            <button class="card-btn play-btn-card" data-action="play" aria-label="Play ${song.title}">
              <i class="fas ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>
            </button>
            <button class="card-btn ${isLiked ? 'liked' : ''}" data-action="like" aria-label="Like ${song.title}">
              <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
            </button>
            <button class="card-btn ${isDownloaded ? 'downloaded' : ''}" data-action="download" aria-label="Download ${song.title}">
              <i class="fas ${isDownloaded ? 'fa-check' : 'fa-download'}"></i>
            </button>
          </div>
        `;

        card.addEventListener('click', (e) => {
          const actionBtn = e.target.closest('[data-action]');
          if (actionBtn) {
            e.stopPropagation();
            const action = actionBtn.dataset.action;
            if (action === 'play') togglePlaySong(song);
            else if (action === 'like') toggleLike(song.id);
            else if (action === 'download') downloadSong(song);
          } else {
            togglePlaySong(song);
          }
        });

        musicGrid.appendChild(card);
      });
    }

    /* ============================================================
       PLAYBACK
       ============================================================ */
    function loadSong(song, autoplay = true) {
      const index = SONGS.indexOf(song);
      if (index === -1) return;
      state.currentSongIndex = index;

      audio.src = song.audioUrl;
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      playerArt.innerHTML = `<i class="fas ${song.artIcon}"></i>`;
      playerArt.classList.toggle('spinning', autoplay);
      totalDurationEl.textContent = song.duration;

      if (autoplay) {
        audio.play().catch(() => {
          showToast('Tap play to start audio (browser policy)', 'fa-info-circle');
        });
        state.isPlaying = true;
        updatePlayPauseIcon();
      }

      updateCardPlayingStates();
      renderMusicGrid();
    }

    function togglePlaySong(song) {
      const index = SONGS.indexOf(song);

      if (state.currentSongIndex === index && audio.src) {
        if (state.isPlaying) {
          audio.pause();
          state.isPlaying = false;
        } else {
          audio.play().catch(() => {});
          state.isPlaying = true;
        }
        updatePlayPauseIcon();
        playerArt.classList.toggle('spinning', state.isPlaying);
        updateCardPlayingStates();
        renderMusicGrid();
        return;
      }

      loadSong(song, true);
    }

    function updatePlayPauseIcon() {
      const icon = playPauseBtn.querySelector('i');
      icon.className = state.isPlaying ? 'fas fa-pause' : 'fas fa-play';
      playPauseBtn.setAttribute('aria-label', state.isPlaying ? 'Pause' : 'Play');
    }

    function updateCardPlayingStates() {
      $$('.music-card').forEach(card => {
        const songId = Number(card.dataset.songId);
        const isCurrent = SONGS[state.currentSongIndex]?.id === songId;
        card.classList.toggle('playing', isCurrent && state.isPlaying);
        const btn = card.querySelector('[data-action="play"] i');
        if (btn && isCurrent) {
          btn.className = `fas ${state.isPlaying ? 'fa-pause' : 'fa-play'}`;
        } else if (btn) {
          btn.className = 'fas fa-play';
        }
      });
    }

    function playNext() {
      let nextIndex;
      if (state.shuffle) {
        do {
          nextIndex = Math.floor(Math.random() * SONGS.length);
        } while (nextIndex === state.currentSongIndex && SONGS.length > 1);
      } else {
        nextIndex = (state.currentSongIndex + 1) % SONGS.length;
      }
      loadSong(SONGS[nextIndex], true);
    }

    function playPrev() {
      let prevIndex;
      if (state.shuffle) {
        do {
          prevIndex = Math.floor(Math.random() * SONGS.length);
        } while (prevIndex === state.currentSongIndex && SONGS.length > 1);
      } else {
        prevIndex = (state.currentSongIndex - 1 + SONGS.length) % SONGS.length;
      }
      loadSong(SONGS[prevIndex], true);
    }

    /* ============================================================
       AUDIO EVENTS
       ============================================================ */
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressBar.value = pct;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('error', () => {
      showToast('Could not load audio file. Check the file path.', 'fa-exclamation-triangle');
    });

    audio.addEventListener('ended', () => {
      if (state.repeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    audio.addEventListener('play', () => {
      state.isPlaying = true;
      updatePlayPauseIcon();
      playerArt.classList.add('spinning');
      updateCardPlayingStates();
    });

    audio.addEventListener('pause', () => {
      state.isPlaying = false;
      updatePlayPauseIcon();
      playerArt.classList.remove('spinning');
      updateCardPlayingStates();
    });

    /* ============================================================
       PROGRESS / VOLUME
       ============================================================ */
    progressBar.addEventListener('input', () => {
      if (!audio.duration) return;
      audio.currentTime = (progressBar.value / 100) * audio.duration;
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = parseFloat(volumeBar.value);
      updateVolumeIcon();
    });

    volumeIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.volume = 0;
        volumeBar.value = 0;
      } else {
        audio.volume = 0.7;
        volumeBar.value = 0.7;
      }
      updateVolumeIcon();
    });

    function updateVolumeIcon() {
      const vol = audio.volume;
      if (vol === 0) volumeIcon.className = 'fas fa-volume-mute';
      else if (vol < 0.4) volumeIcon.className = 'fas fa-volume-down';
      else volumeIcon.className = 'fas fa-volume-up';
    }

    /* ============================================================
       LIKE / DOWNLOAD
       ============================================================ */
    function toggleLike(songId) {
      if (state.likedSongs.has(songId)) {
        state.likedSongs.delete(songId);
        showToast('Removed from favorites', 'fa-heart-broken');
      } else {
        state.likedSongs.add(songId);
        showToast('Added to favorites', 'fa-heart');
      }
      renderMusicGrid();
    }

    async function downloadSong(song) {
      if (state.downloadedSongs.has(song.id)) {
        showToast('Already downloaded', 'fa-check-circle');
        return;
      }

      showToast(`Downloading "${song.title}"...`, 'fa-download');

      try {
        const response = await fetch(song.audioUrl);
        if (!response.ok) throw new Error('Network response not ok');
        const blob = await response.blob();

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = song.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        state.downloadedSongs.add(song.id);
        state.downloads.push(song);
        renderDownloads();
        renderMusicGrid();
        showToast(`"${song.title}" downloaded successfully!`, 'fa-check-circle');
      } catch (err) {
        const a = document.createElement('a');
        a.href = song.audioUrl;
        a.download = song.filename;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        state.downloadedSongs.add(song.id);
        state.downloads.push(song);
        renderDownloads();
        renderMusicGrid();
        showToast(`"${song.title}" download started!`, 'fa-check-circle');
      }
    }

    function renderDownloads() {
      if (state.downloads.length === 0) {
        downloadsList.innerHTML = `
          <p class="empty-state">
            <i class="fas fa-cloud-download-alt"></i>
            No downloads yet. Click the download icon on any song.
          </p>`;
        return;
      }

      downloadsList.innerHTML = '';
      state.downloads.forEach(song => {
        const item = document.createElement('div');
        item.className = 'download-item';
        item.innerHTML = `
          <div class="dl-art"><i class="fas ${song.artIcon}"></i></div>
          <div class="dl-info">
            <div class="dl-title">${song.title}</div>
            <div class="dl-artist">${song.artist}</div>
          </div>
          <div class="dl-status"><i class="fas fa-check-circle"></i> Downloaded</div>
        `;
        downloadsList.appendChild(item);
      });
    }

    /* ============================================================
       SORT / FILTER
       ============================================================ */
    sortBtn.addEventListener('click', () => {
      state.sortAsc = !state.sortAsc;
      sortBtn.innerHTML = `<i class="fas fa-sort"></i> Sort by Title ${state.sortAsc ? '↑' : '↓'}`;
      renderMusicGrid();
    });

    filterFavBtn.addEventListener('click', () => {
      state.filterFavorites = !state.filterFavorites;
      filterFavBtn.classList.toggle('active', state.filterFavorites);
      filterFavBtn.innerHTML = state.filterFavorites
        ? '<i class="fas fa-heart"></i> Showing Favorites'
        : '<i class="fas fa-heart"></i> Favorites';
      renderMusicGrid();
    });

    /* ============================================================
       SHUFFLE / REPEAT / PLAYER CONTROLS
       ============================================================ */
    shuffleBtn.addEventListener('click', () => {
      state.shuffle = !state.shuffle;
      shuffleBtn.classList.toggle('active', state.shuffle);
      showToast(state.shuffle ? 'Shuffle ON' : 'Shuffle OFF', 'fa-random');
    });

    repeatBtn.addEventListener('click', () => {
      state.repeat = !state.repeat;
      repeatBtn.classList.toggle('active', state.repeat);
      showToast(state.repeat ? 'Repeat ON' : 'Repeat OFF', 'fa-redo');
    });

    playPauseBtn.addEventListener('click', () => {
      if (!audio.src) {
        loadSong(SONGS[0], true);
        return;
      }
      if (state.isPlaying) {
        audio.pause();
      } else {
        audio.play().catch(() => {});
      }
    });

    prevBtn.addEventListener('click', playPrev);
    nextBtn.addEventListener('click', playNext);

    exploreBtn.addEventListener('click', () => {
      document.getElementById('musicSection').scrollIntoView({ behavior: 'smooth' });
    });

    /* ============================================================
       KEYBOARD SHORTCUTS
       ============================================================ */
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        playPauseBtn.click();
      } else if (e.code === 'ArrowRight' && e.altKey) {
        playNext();
      } else if (e.code === 'ArrowLeft' && e.altKey) {
        playPrev();
      }
    });

    /* ============================================================
       INIT
       ============================================================ */
    function init() {
      renderMusicGrid();
      renderDownloads();
      audio.volume = 0.7;
      updateVolumeIcon();

      const first = SONGS[0];
      playerTitle.textContent = first.title;
      playerArtist.textContent = first.artist;
      playerArt.innerHTML = `<i class="fas ${first.artIcon}"></i>`;
      totalDurationEl.textContent = first.duration;
      state.currentSongIndex = 0;

      showToast('Welcome to NEBULA — tap any song to play', 'fa-music');
    }

    init();
  </script>
</body>
</html>
